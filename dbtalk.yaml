# Defaults. Use .env.<DBTALK_ENVKEY> or DBTALK_* variables for local overrides.
verbose: false

logging:
  level: INFO
  format: "%(asctime)s %(levelname)s %(name)s: %(message)s"

mysqldump:
  host: localhost
  port: 3306
  user: ""
  password: ""
  database: ""
  output_directory: data

mysqlrestore:
  host: localhost
  port: 3306
  user: ""
  password: ""
  database: ""

database:
  zero_datetime_as_null: true
  operation_timeout_seconds: 30

postgres:
  output_directory: data
  client_image: postgres:18
