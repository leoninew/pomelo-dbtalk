# Copy this file to backup_databases.yaml and replace the placeholders.
output_directory: ../data

dsn_values:
  DBTALK_EXAMPLE_DSN: "mysql+pymysql://<user>:<password>@<host>:3306/<database>"

connections:
  example:
    engine: mysql
    address: "<host>:3306"
    databases:
      - name: "<database>"
        dsn_env: DBTALK_EXAMPLE_DSN
